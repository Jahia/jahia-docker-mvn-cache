name: Census - Module parent versions

# Keeps module-parent-versions.txt in step with the parent each repository declares. The job never
# changes the image by itself: it opens a pull request, and the image is rebuilt when that lands on
# the default branch. To measure a proposal before merging it, dispatch the build workflow on the
# proposal branch, which tags its images after the branch.

on:
  schedule:
    # Every day at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Enough to push the proposal branch and to open, update or close its pull request. Reading the
# other repositories of the organisation is out of reach of this token, and uses the one below.
permissions:
  contents: write
  pull-requests: write

jobs:
  census:
    name: Rewrite the warmed parent versions
    runs-on: ubuntu-latest
    steps:
      # No token: the default one is the job's own, so the branch and the pull request below are
      # the bot's rather than a person's. It does mean the pull request starts no build -- see the
      # note at the top of this file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the parent version declared by each repository
        id: census
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ISSUES_PRS_CHORES }}
        run: python3 scripts/census-module-parents.py 2>census.log

      # always(), because the census writes its whole account — the repositories it read, every
      # version it dropped and why, and a traceback if it raises — to census.log rather than to
      # the job log. Without this the step that raises takes the log down with the runner, and
      # the run ends red with no output at all.
      - name: Report what the census found
        if: always()
        run: |
          {
            echo '## Census'
            echo '```'
            cat census.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The file is rewritten only by a census that finished, so after a failure the working
          # copy is still the committed one, and printing it would show a proposal that nothing
          # proposed.
          if [[ '${{ steps.census.outcome }}' == 'success' ]]; then
            {
              echo '## Proposed file'
              echo '```'
              cat module-parent-versions.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open a pull request when the file changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/module-parent-versions
        run: |
          set -euo pipefail
          # Compare the versions, not the file. A repository moving from one warmed version to
          # another rewrites the comments while the warmed set stays the same, and that must not
          # cost a pull request and a full rebuild of the image.
          versions() { sed -e 's/#.*//' | awk '{print $1}' | awk 'NF'; }
          # Against the default branch, not against the ref this ran from. A dispatch from the
          # proposal branch would otherwise find the census's own output already committed there,
          # read that as nothing having changed, and close the very pull request it is proposing.
          # The checkout is shallow and single branch, so the default branch has to be fetched.
          git fetch --depth=1 origin main
          if git cat-file -e FETCH_HEAD:module-parent-versions.txt 2>/dev/null; then
            git show FETCH_HEAD:module-parent-versions.txt | versions > /tmp/versions-before
          else
            # The default branch does not carry the file yet, so everything is new.
            : > /tmp/versions-before
          fi
          versions < module-parent-versions.txt > /tmp/versions-after
          # --state open, because `gh pr view <branch>` also resolves a closed or merged one. Once
          # this branch's last pull request lands, that answer would report success and leave a new
          # proposal pushed with nothing open to review it.
          existing="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if diff -q /tmp/versions-before /tmp/versions-after >/dev/null; then
            echo "The warmed versions are unchanged. Only the repository lists moved, so no pull request is opened."
            # An open pull request was proposing versions this run no longer proposes: the
            # organisation moved back on its own. Left alone it would still be mergeable, and would
            # warm a set nothing asks for any more.
            if [[ -n ${existing} ]]; then
              gh pr comment "${existing}" --body "The census no longer proposes these versions: what the repositories declare now matches the warmed set. Closing, so nothing here is merged by mistake. A later run will open a new pull request if the versions diverge again."
              gh pr close "${existing}" --delete-branch
              echo "Closed the stale pull request #${existing}."
            fi
            exit 0
          fi
          diff /tmp/versions-before /tmp/versions-after || true
          git config user.name "Jahia Continuous Integration account"
          git config user.email "jahia-ci@users.noreply.github.com"
          # The pull request targets main, so its head has to sit on main and carry nothing else:
          # a dispatch from any other ref would put that ref's commits in the proposal, and
          # merging the proposal would merge them too. FETCH_HEAD is the default branch fetched
          # above; switching to it would overwrite the file the census just wrote, so that is set
          # aside first.
          cp module-parent-versions.txt /tmp/proposed.txt
          # -f because the census left that file modified, which otherwise blocks the switch.
          git checkout -f -B "${BRANCH}" FETCH_HEAD
          cp /tmp/proposed.txt module-parent-versions.txt
          git add module-parent-versions.txt
          git commit -m "chore: update the warmed jahia-modules parent versions"
          git push --force origin "${BRANCH}"
          {
            echo "The versions warmed by the Maven cache no longer match what the repositories using this image declare. This pull request proposes the list the census produced."
            echo
            echo "Each added version costs about 24 MB of compressed image, paid on every pull by every job. The build of this pull request publishes an image, so the size can be compared against the one on \`main\` before merging."
            echo
            echo '```'
            cat census.log
            echo '```'
          } > pr-body.md
          if [[ -n ${existing} ]]; then
            # The force-push already moved the pull request. Its body quotes the census log, which
            # this run has replaced, so that is rewritten rather than left describing an older set.
            gh pr edit "${existing}" --body-file pr-body.md
            echo "Updated the open pull request #${existing}."
            exit 0
          fi
          gh pr create --base main --head "${BRANCH}" \
            --title "chore: update the warmed jahia-modules parent versions" \
            --body-file pr-body.md
